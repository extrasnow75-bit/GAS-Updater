# Builds a Windows installer of the TEST BUILD and keeps it as a downloadable file on the
# run's page in the Actions tab. Runs on every push to a claude/ branch, or by hand from the
# Actions tab ("Run workflow"). It does not publish a release.
#
# Security:
# - No secrets are used here, and none must ever be added: anyone who can push a claude/
#   branch can run this workflow. Real releases will get their own tag-triggered workflow
#   behind a protected GitHub Environment.
# - The job's token can only read the repo.
# - Actions are pinned to exact commits (the tag is in the comment), so a moved tag cannot
#   change what runs.

name: Test build

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer
        # --publish never: electron-builder would otherwise try to publish from CI.
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GAS-Updater-TEST-BUILD-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
