# Builds a Windows installer of the TEST BUILD and keeps it as a downloadable file on the
# run's page in the Actions tab. Runs on every push to a claude/ branch, or by hand from the
# Actions tab ("Run workflow"). It does not publish a release.
#
# Same steps as Canvas Extractor Tools' release workflow, minus publishing: type-check,
# test, then build. No secrets are needed yet, because the test build does not sign in to
# Google.

name: Test build

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer
        # --publish never: electron-builder would otherwise try to publish from CI.
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: GAS-Updater-TEST-BUILD-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
